name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish Windows release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test FetchIt.sln -c Release --nologo --filter FullyQualifiedName!~E2eProbeTests

      - name: Publish win-x64
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart("v")
          echo "VERSION=$version" >> $env:GITHUB_ENV
          $out = Join-Path $pwd "publish\win-x64"
          New-Item -ItemType Directory -Force -Path $out, artifacts | Out-Null

          dotnet publish FetchIt.csproj -c Release -r win-x64 --self-contained true `
            /p:PublishSingleFile=true `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            /p:DebugType=none `
            /p:Version=$version `
            /p:InformationalVersion=$tag `
            -o $out

          & .\scripts\Get-Tools.ps1 -OutDir $out
          Copy-Item Assets/fetchit.ico "$out/FetchIt.ico" -Force
          Copy-Item README.md $out -Force
          Copy-Item LICENSE $out -Force

          $zip = "fetch-it-$tag-win-x64.zip"
          Compress-Archive -Path "$out\*" -DestinationPath $zip -Force

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $publish = (Join-Path $pwd "publish\win-x64").Replace('\', '/')
          & $iscc "/DMyAppVersion=$env:VERSION" "/DPublishDir=$publish" .\installer\fetch-it.iss
          Copy-Item ".\artifacts\fetch-it-v$($env:VERSION)-win-x64-setup.exe" . -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            fetch-it-*.zip
            fetch-it-*-win-x64-setup.exe
