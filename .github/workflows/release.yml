name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish Windows release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'

      - name: Verify tool-pins signature
        run: node scripts/verify-tool-pins.mjs

      - name: Test
        run: dotnet test FetchIt.sln -c Release --nologo

      - name: Publish win-x64
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart("v")
          echo "VERSION=$version" >> $env:GITHUB_ENV
          $out = Join-Path $pwd "publish\win-x64"
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

          & .\scripts\Publish-WinX64.ps1 -OutDir $out -Version $version -Tag $tag

          Copy-Item README.md $out -Force
          Copy-Item LICENSE $out -Force

          $zip = "fetch-it-$tag-win-x64.zip"
          Compress-Archive -Path "$out\*" -DestinationPath $zip -Force

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $publish = (Join-Path $pwd "publish\win-x64").Replace('\', '/')
          & $iscc "/DMyAppVersion=$env:VERSION" "/DPublishDir=$publish" .\installer\fetch-it.iss
          Copy-Item ".\artifacts\fetch-it-v$($env:VERSION)-win-x64-setup.exe" . -Force

      - name: Write SHA256SUMS.txt
        shell: pwsh
        run: |
          $lines = Get-ChildItem fetch-it-*.zip, fetch-it-*-win-x64-setup.exe | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant(), $_.Name
          }
          [IO.File]::WriteAllLines((Join-Path $pwd "SHA256SUMS.txt"), $lines)
          Get-Content SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            fetch-it-*.zip
            fetch-it-*-win-x64-setup.exe
            SHA256SUMS.txt
